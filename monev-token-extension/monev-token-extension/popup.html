<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monev Token Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="badge">SESI BROWSER · <span id="version"></span></span><h1>Monev Token Helper</h1></header>
  <p>Cari <strong>monev_refresh_token</strong> atau <strong>access token</strong> pada situs yang sudah Anda login.</p>
  <div id="site">Memuat tab aktif…</div>
  <div class="actions">
    <button id="scan" disabled>Cari access token</button>
    <button id="cookies" class="secondary" disabled>Cari refresh token + cookies API</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="results"></div>
  <footer>Token hanya ada di popup ini. Popup ditutup, hasil dibersihkan. Gunakan pada akun milik Anda.</footer>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
